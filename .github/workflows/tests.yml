name: Tests

# Runs automatically on every push and PR. Uses GitHub Actions' own free-tier
# runner minutes — completely separate from, and does not consume, Codespaces
# hours. Installs from requirements.txt and requirements-dev.txt, the same
# two files a local checkout installs from — see README.md Environment. See
# DEF-12: this previously installed a hand-picked dependency list instead,
# so "green CI" didn't mean the same thing as "requirements.txt resolves".

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v
